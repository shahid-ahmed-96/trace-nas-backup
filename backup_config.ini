# Backup settings. This is the only file each person needs to edit.

[backup]
# SSH alias for the cluster, as set up in ~/.ssh/config.
ssh_host = data

# Folder on the cluster to back up (everything inside it, all subfolders).
source = /trace/group/mcgaughey/$trace_username$

# Where the NAS is mounted on this Ubuntu machine.
# If it is not mounted, the backup copies nothing and logs "McGaughey-Lab was not mounted".
mount_point = /home/$local_username$/mcgaughey-lab

# Folder on the NAS that receives the backup. The tree inside it matches the source exactly.
destination = /home/$local_username$/mcgaughey-lab/$path$

# Folder on the cluster where the logs go, one file per day: backuplog.YYYY_MM_DD.csv
log_dir = /trace/group/mcgaughey/$trace_username$/backup_logs

exclude_dirs =
    $directory1$/
    $directory2$/
